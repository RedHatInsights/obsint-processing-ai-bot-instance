name: watchduty
type: workflow
description: Scheduled watchduty workflow — monitors Jenkins CI jobs and reports via Slack

preflight:
  - 01-jenkins-status.sh

provides:
  claude_md: CLAUDE.md
  skills:
    - triage-jenkins

requires:
  mcp_servers:
    - bot-memory
  env_vars:
    - BOT_LABEL
    - BOT_INSTANCE_ID
    - SLACK_WEBHOOK_URL
