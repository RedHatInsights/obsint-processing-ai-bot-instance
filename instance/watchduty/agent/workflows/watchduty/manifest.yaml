name: watchduty
type: workflow
description: Scheduled watchduty workflow — monitors Jenkins CI and MintMaker PRs, reports via Slack

preflight:
  - 01-jenkins-status.py
  - 02-mintmaker-prs.py

# Native workflow instructions are loaded from AGENTS.md.

requires:
  mcp_servers:
    - bot-memory
  env_vars:
    - BOT_LABEL
    - BOT_INSTANCE_ID
    - SLACK_WEBHOOK_URL
